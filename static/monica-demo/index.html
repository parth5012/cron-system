<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monica CRM PR Verification Walkthrough</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 24px;
    }
    .badge {
      background: #2563eb;
      color: #eff6ff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .video-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      max-width: 960px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }
    .video-meta {
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }
    .links {
      display: flex;
      gap: 12px;
    }
    .link-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .link-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">E2E Verification</div>
    <h1>Monica Personal CRM Demo</h1>
    <p>Live reproduction and verification of Pull Requests #7987 (Theme toggle asset build), #7988 (Footer release notes link), and #7989 (Life event annual reminder creation).</p>
  </div>

  <div class="video-card">
    <video controls autoplay muted playsinline>
      <source src="demo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-meta">
      <div>
        <span style="color: #10b981; font-weight: 700;">✓ Verified Builds &amp; Tests</span>
        <span style="color: #64748b; margin-left: 8px;">Duration: 54s</span>
      </div>
      <div class="links">
        <a class="link-btn" href="https://github.com/monicahq/monica/pull/7987" target="_blank">PR #7987</a>
        <a class="link-btn" href="https://github.com/monicahq/monica/pull/7988" target="_blank">PR #7988</a>
        <a class="link-btn" href="https://github.com/monicahq/monica/pull/7989" target="_blank">PR #7989</a>
      </div>
    </div>
  </div>
</body>
</html>
