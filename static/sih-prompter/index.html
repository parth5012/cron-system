<script>
const data={
artify:{title:"1 - Artifact / Artify Bharat - SIH26090 (Heritage, Software)",file:"Artifact26090 - AI-Driven Market Linkage for Marginalized Artisans",slides:[
{t:"Slide 1 - Title",img:"slides/artify-1.png",time:"0:00 - 0:30",pts:["SIH26090, Heritage and Culture","Team Artifact","AI market linkage + smart cataloguing"],script:"Good morning judges. We are Team Artifact, problem statement 26090, AI-driven market linkage and smart cataloguing for marginalized artisans.\n\n<b>Start with her, not us.</b> Malti Devi from Varanasi has woven silk for 40 years. She earns about 150 rupees a day. The same saree sells in a Delhi boutique for 15,000. She has never opened a GeM account. She cannot fill an English form, and she has no studio to photograph her work.\n\nYesterday she spoke for 30 seconds in Bhojpuri into our app. It made a clean catalogue entry, priced it fairly, got it verified by her own village peers, printed a passport tag, and listed it on GeM and ONDC in one tap. That is Artify Bharat.",cue:"CUE: Smile. Pause 2 sec after boutique price. Let the 150 vs 15,000 gap land. Do not rush.",trans:"TRANSITION: So why does this gap exist for 20 million artisans? Next slide."},
{t:"Slide 2 - Problem + 6 Modules",img:"slides/artify-2.png",time:"0:30 - 1:40",pts:["Fake handmade claims","Middlemen take 85 percent","Text-heavy onboarding blocks artisans","6 modules: Studio, Voice, Fair Wage, Peer Jury, Passport, Markets"],script:"Three pains, judges.\n\n<b>One, trust.</b> Anyone can type 100 percent handmade on a listing. Machine-made polyester from a powerloom sells as handloom. Buyers cannot tell, honest weavers lose.\n\n<b>Two, income.</b> The artisan gets under 15 percent of retail. Middlemen take the rest because only they know how to reach markets.\n\n<b>Three, access.</b> Every app asks for English typing, HSN codes, taxonomy dropdowns, studio photos. Our user cannot do any of that.\n\nTraditional marketplace says handmade as a text claim. We say <b>verified handmade as evidence</b>: work-in-progress photo plus live GPS plus timestamp plus peer jury plus cryptographic passport.\n\nOur six modules, left to right on screen. Authenticity Studio. Voice-first cataloguing. Fair-wage pricing. Peer verification with 2-of-3 consensus. Digital craft passport with QR. Market access to ONDC, GeM and direct buyers. The flow at the bottom is the whole pitch: Create, Final, GPS plus Time, Verify, Passport, Buyer.",cue:"CUE: Walk the flow with your finger Create to Buyer. Point at Authenticity Proof box. Slow on 2-of-3.",trans:"TRANSITION: That is what it does. Now how it works under the hood."},
{t:"Slide 3 - Technical Approach",img:"slides/artify-3.png",time:"1:40 - 3:10",pts:["Capture, Verify, Preserve, Publish","rembg U2-Net + CLAHE, Whisper + IndicTrans2","3-peer jury + anomaly checks","PWA + FastAPI + Postgres vault + S3","Live example AB-2026-00123 Sita Devi"],script:"Our chain is <b>Capture, Verify, Preserve, Publish</b>, top of slide.\n\n<b>Capture.</b> The PWA opens the camera with a 1 to 1 crop lock and gyro level. The artisan takes a work-in-progress loom photo and a final photo. The browser locks live GPS and UTC timestamp. Drafts save in IndexedDB when offline.\n\n<b>AI processing.</b> Voice goes through Whisper ASR plus IndicTrans2 into structured catalogue JSON, so Bhojpuri speech becomes title, material, dimensions with zero typing. Photos go through rembg U2-Net background isolation plus OpenCV CLAHE colour fix in LAB space. Deliberate choice: <b>non-generative AI</b>. We never hallucinate texture. Real weave stays real.\n\n<b>Pricing.</b> Material plus labour days plus skill plus overhead, floored at the statutory 450 rupees per day. The slider shows Floor, Retail, Bulk. The app refuses predatory pricing below floor.\n\n<b>Verify.</b> Random 3-peer jury from nearby clusters, creator and same-SHG excluded, 2-of-3 quorum, Redis velocity checks flag rubber-stamping over 20 votes per hour.\n\n<b>Passport and publish.</b> SHA-256 binds artisan ID plus GPS plus time plus WIP digest into product AB-2026-00123, shown here for Sita Devi, Madhubani. QR prints over Web Bluetooth to a 1500-rupee thermal printer, or hand-copied to cardboard with zero hardware. One tap pushes GeM CSV, ONDC Beckn JSON and WhatsApp. Backend is FastAPI gateway, Postgres with AES-256 PII vault, S3 MinIO media, Docker. 146 tests passing.",cue:"CUE: This slide proves engineering depth. Name each tech once, clearly. Tap the passport card and the PWA user layer.",trans:"TRANSITION: Strong tech means nothing if it dies in a village with no signal. Next slide."},
{t:"Slide 4 - Feasibility + Risks",img:"slides/artify-4.png",time:"3:10 - 4:10",pts:["PWA, voice AI, offline-first","SHG / Bank Sakhi assisted model","0 percent commission","Every risk has a mitigation","Village to National DPI scale"],script:"Feasibility in three parts.\n\n<b>Technical.</b> PWA means no Play Store, runs on a 5000-rupee phone, Camera, Geolocation, Web Bluetooth and IndexedDB all browser-native. FastAPI plus Postgres plus object storage is boring and reliable.\n\n<b>Operational.</b> We do not ask every weaver to go digital. One SHG leader, Bank Sakhi or CSC VLE supports up to 50 artisans in assisted mode. Money flows artisan to platform to buyer with <b>0 percent commission</b>, direct Jan Dhan payout, buyer Report Fake freezes escrow pending inspection.\n\n<b>Risks, pre-answered.</b> Low literacy: voice UI plus assisted mode. Connectivity: offline drafts plus sync. Collusion: random jury plus quorum plus anomaly checks. False buyer reports: single report never punishes, independent inspection first. Scale path is Pilot village, Cluster, District, State, National craft DPI, using infrastructure the government already funds.",cue:"CUE: Judges probe feasibility hardest. Deliver mitigations crisply, one breath each.",trans:"TRANSITION: If it is feasible, what does the country get?"},
{t:"Slide 5 - Impact",img:"slides/artify-5.png",time:"4:10 - 4:40",pts:["Social, economic, trust, heritage, ecosystem","Artisans, SHGs, buyers, government","Fair value, verified origin, live audits"],script:"Five impacts on screen.\n\nSocial inclusion: voice-first multilingual onboarding removes literacy barriers. Economic empowerment: enforced wage floor means at least 80 percent of value stays with the maker instead of 15. Trust: tamper-evident passports with WIP provenance end fake-handmade fraud. Heritage: dialect audio stories and immutable records preserve crafts that die with their makers. Rural ecosystem: SHG-led commerce with zero middlemen.\n\nStakeholder by stakeholder. Artisans get cataloguing, fair price, direct payout, wider reach. SHGs get a cluster hub. Buyers get verified origin and transparent price. Government gets live economic heatmaps, GeM procurement and immutable audits across pilot clusters tracking over 3.19 crore and 4900 artisans.",cue:"CUE: Slow down 20 percent here. Impact sentences win internal rounds.",trans:"TRANSITION: Close with proof and references."},
{t:"Slide 6 - References + Close",img:"slides/artify-6.png",time:"4:40 - 5:00",pts:["github.com/parth5012/artify-bharat-sih","Textiles Ministry, artisan interviews, ONDC","3 buyer questions answered"],script:"Everything is open source at the repo on screen. Research grounded in Ministry of Textiles reports, artisan field interviews and ONDC specs.\n\nWe answer the three questions every buyer asks. Can I trust handmade. Does the product really look like this. Is the price fair.\n\nJudges, we do not list products. <b>We issue passports for heritage.</b> Thank you, happy to demo the camera, the voice flow, or a live shortcode scan.",cue:"CUE: Hold up the printed thermal tag. Eye contact. Stop. Do not add extra lines.",trans:"Q&A READY: handmade proof = WIP+GPS+time hash. Collusion = exclude SHG + quorum + velocity. Offline = IndexedDB + assisted mode + cardboard fallback."}
],qa:"<h3>Artify - Likely Q and A (30-sec answers)</h3><b>Q: How do you prove handmade vs powerloom?</b><br>A: Deterministic SHA-256 over artisan ID + 6-decimal GPS + UTC + WIP loom-photo digest. Change one pixel, hash fails. Buyer scan shows full chain.<br><br><b>Q: What stops peer collusion?</b><br>A: Random assignment, creator and same-SHG excluded, 2-of-3 quorum, Redis flags over 20 votes/hour as rubber-stamp.<br><br><b>Q: Illiterate artisan, no network?</b><br>A: 22-dialect voice, SHG leader handles 50 weavers, IndexedDB drafts sync later, 6-char code works on cardboard."},
orca:{title:"2 - Techie / ORCA Marine Intelligence - SIH26176 (Disaster Mgmt, Software)",file:"Techie-SIH26176 - ORCA Marine Ecosystem Reasoning with Collaborative Agents",slides:[
{t:"Slide 1 - Title",img:"",time:"0:00 - 0:30",pts:["SIH26176, Disaster Management","Team Techie","Ocean data to decisions"],script:"Good morning judges. We are Team Techie, problem statement 26176, ORCA, Marine Ecosystem Reasoning with Collaborative Agents.\n\n<b>Open with danger.</b> Last cyclone season, swells over 3 metres hit the Kerala coast. INCOIS had issued a correct advisory, but as a dense English table with bearings like Pallithottam 232 degrees, 55 to 60 metres depth. A fisherman with wet hands, no English, and no time to interpret tables sailed toward the fish and straight into the hazard.\n\nORCA stops that. We turn satellite, ocean, weather, hazard and map data into a spoken safe route in his own language.",cue:"CUE: Serious tone. Pause after sailed into the hazard.",trans:"TRANSITION: What exactly does ORCA add over existing portals?"},
{t:"Slide 2 - Solution + Challenge",img:"",time:"0:30 - 1:40",pts:["6 pillars incl. agents + geofencing + explainability","Data fragmented, manual, English-only, slow","Understand-Connect-Reason-Recommend","Hindi query to PFZ+safety+route+evidence"],script:"ORCA is an intelligent marine decision platform. Six pillars on screen: natural-language interaction, collaborative AI agents, multi-source marine intelligence, spatial plus temporal reasoning, safety and geofencing, explainable recommendations with the why behind every suggestion.\n\nExisting systems provide marine <b>information</b>. ORCA produces contextual, explainable <b>decisions</b>.\n\nThe challenge box is honest: marine data is fragmented across portals, complex and manual, non-contextual to your boat and hour, language-locked in technical English, and slow to act on when safety, catch and restrictions collide.\n\nOur flow: <b>Understand</b> the query, for example Kal subah 6 baje fishing ke liye safest PFZ kaunsa hai. <b>Connect</b> PFZ plus weather plus ocean plus hazards plus geo constraints. <b>Reason</b> over location, time and conditions. <b>Recommend</b> a safe actionable decision: recommended PFZ plus safety check plus route plus evidence.\n\nThe gap line at the bottom is our thesis: data exists, but actionable decisions require connecting and reasoning across it. Weather plus satellite plus hazard plus GIS plus ocean, fused.",cue:"CUE: Trace Understand to Recommend with finger. Read the Hindi query in Hindi, it always gets a smile.",trans:"TRANSITION: How does the reasoning actually run?"},
{t:"Slide 3 - Technical Approach",img:"",time:"1:40 - 3:10",pts:["Intent, decompose, orchestrator, 5 specialist agents","INCOIS ISRO IMD GIS retrieval","Fusion + safety validation","LangGraph + LangChain + Groq/Gemini + Bhashini"],script:"How ORCA reasons, step by step.\n\nUser query arrives as text or Bhashini voice. Intent and context detection extracts location, time and language. Task decomposition splits one question into parallel jobs. The AI orchestrator selects specialist agents: PFZ agent, Ocean agent, Geospatial agent, Hazard agent, Weather agent.\n\nRetrieval hits INCOIS for PFZ, SST and chlorophyll fronts, ISRO earth observation, IMD for weather and cyclones, Open-Meteo for forecast and ocean state, plus GIS layers for EEZ 200 nautical miles, marine protected areas and the IMBL.\n\nThen spatial and temporal reasoning: haversine distance and bearing from live GPS, wave height, period, swell vectors, 10-metre wind and gusts, pressure-drop cyclone check under 995 hPa. Evidence fusion cross-checks sources, applies hard safety validation and vetoes, and outputs PFZ plus safe route plus alerts plus map.\n\nCentre equation: location plus time plus hazards into ORCA intelligence equals safe plus explainable decision. Transparent reasoning, multi-source verified, actionable. Try any of the four intents on screen: safest PFZ tomorrow, check weather and hazards, plan a safe route, show current conditions.\n\nStack in one breath: LangGraph orchestration, LangChain tools, Groq Llama plus Gemini Flash under 500 ms planning, Bhashini ASR NMT TTS for 22 languages, FastAPI with SSE streaming, Next.js MapLibre frontend, PostGIS plus Redis cache, 140 plus tests and 8 of 8 Playwright E2E green.",cue:"CUE: This is the technical credibility slide. Name each agent while pointing. Do not skip the veto sentence.",trans:"TRANSITION: Impressive, but does it run at sea and at scale?"},
{t:"Slide 4 - Feasibility",img:"",time:"3:10 - 4:10",pts:["PostGIS geo, Next.js web, free data, agent AI","Pipeline data to decision","Fisherfolk, authorities, researchers","Zero API cost, sub-500ms"],script:"Feasibility, five blocks.\n\nGeo intelligence with GeoPandas, Shapely, PostGIS spatial queries, raster and vector processing, Leaflet and MapLibre rendering. Web platform with Next.js React TypeScript Tailwind, real-time SSE updates, deployed on Vercel plus Render. Data ecosystem entirely on reliable free tiers: INCOIS, IMD, Open-Meteo, GIS layers. AI foundation with LangGraph, LangChain, Groq/Gemini and Bhashini. Pipeline: marine data to ORCA agents to marine intelligence to actionable decision.\n\nOperationally: fisherfolk get PFZ discovery plus safety plus route. Authorities get hazard monitoring plus geofencing plus situation awareness. Researchers get multi-source analysis. The honest numbers: 437 PFZ points daily, 6-hour Redis cache, offline GeoJSON fallback, 10,000 requests per day per node at zero API cost. That is viable for a hackathon and for a state pilot.",cue:"CUE: Land the zero-cost plus offline line. Judges worry about API bills and signal loss.",trans:"TRANSITION: If feasible, what is the national payoff?"},
{t:"Slide 5 - Impact",img:"",time:"4:10 - 4:40",pts:["Blue economy, livelihoods, disaster safety","Policy, ecosystems, SDG 14","Stronger communities, fewer losses"],script:"Impacts, five boxes.\n\nBlue economy: efficient sustainable use of marine resources. Fisheries and livelihoods: productive zones found faster, 20 to 30 percent diesel saved, catch per trip up, risk down. Disaster management: early warnings for cyclones, extreme weather and unsafe seas before boats leave. Policy and research: multi-source data for planning and monitoring. Marine ecosystems: sustainable fishing that routes around protected sanctuaries.\n\nThis maps directly to <b>SDG 14, Life Below Water</b>. Outcomes: stronger fishing communities, healthier oceans, fewer losses at sea, data-driven decisions, long-term coastal growth.",cue:"CUE: Read the SDG line proudly. Slow down.",trans:"TRANSITION: Sources and close."},
{t:"Slide 6 - References + Close",img:"",time:"4:40 - 5:00",pts:["INCOIS, IMD, Open-Meteo, Marine Regions, Copernicus, WDPA, NOAA, Bhashini","Agentic reasoning over heterogeneous sources"],script:"All sources on screen and in our report: INCOIS PFZ advisories, IMD Mausam, Open-Meteo marine and weather APIs, Marine Regions EEZ boundaries, Copernicus Marine, Protected Planet WDPA, NOAA SST and chlorophyll, Bhashini ULCA for Indian languages.\n\nOur research insight in one line: ORCA brings heterogeneous marine, weather and geospatial sources together and adds an agentic reasoning layer with hard safety vetoes, turning raw advisories into contextual safety-aware decisions.\n\nJudges, we turn satellites into <b>a voice that brings fishermen home alive</b>. Thank you, ready to demo a Tamil query with the live agent trace.",cue:"CUE: End with the closing line verbatim. Offer the Tamil live demo immediately.",trans:"Q&A READY: offshore offline = harbor sync + GPS + cache. Hallucination = deterministic veto LLM cannot override. API down = 4-tier fallback with staleness labels."}
],qa:"<h3>ORCA - Likely Q and A (30-sec answers)</h3><b>Q: No signal offshore?</b><br>A: Harbor sync of 437 PFZ points + boundaries + 24h weather into PWA cache. GPS needs no SIM. Local haversine + IMBL checks run on device.<br><br><b>Q: How do you stop AI hallucination into a cyclone?</b><br>A: Vetoes are deterministic PostGIS + thresholds in combiner code, zero LLM involvement. Failed check suppresses the zone unconditionally.<br><br><b>Q: INCOIS or APIs down?</b><br>A: Live to Redis 6h/30m to local GeoJSON to IMD backup, every level labelled with freshness so users are never misled."},
cred:{title:"3 - CredVault - SIH26125 (BEL, Blockchain and Cybersecurity)",file:"SIH2026-PS26125 - Blockchain Identity, Access Control, Digital Assets - Live cred-vaulte.vercel.app",slides:[
{t:"Page 1 - Title Solution",img:"slides/cred-1.png",time:"0:00 - 0:30",pts:["SIH26125, BEL, Blockchain and Cybersecurity","One ledger for identity, roles, ownership","Live demo cred-vaulte.vercel.app"],script:"Good morning judges. Problem statement 26125 from Bharat Electronics, blockchain-based secure platform for identity, access control and digital asset management.\n\nThe problem in one line: identity and permissions sit in one central database. Breach it and you own every account. Ownership records live in separate systems, so proving who owns what means calling the issuer and trusting whoever replies. Edits leave no trace, and if the issuer shuts down the record becomes unprovable.\n\nOur solution, CredVault: <b>one ledger for identities, roles and asset ownership</b>. Authorised roles issue, holders consent with their own signature, anyone verifies without permission, and only the holder key can read the contents. It is live right now at the URL on screen.",cue:"CUE: Read the one-ledger line exactly. Pause on live URL.",trans:"TRANSITION: How does that work for a real certificate?"},
{t:"Page 2 - Problem + How + Different",img:"slides/cred-2.png",time:"0:30 - 1:40",pts:["Central DB breach, siloed ownership, no trace","5 steps: wallet identity to public verify","Today vs Ours table"],script:"Left column is the pain, judges. Central passwords get stolen, ownership needs phone calls, silent edits, dead issuers.\n\nHow CredVault works, five steps. <b>One</b>, identity is your wallet key pair, proved by signing, no passwords stored anywhere. <b>Two</b>, the admin grants Issuer roles on chain and the contract checks the role on every single call. <b>Three</b>, an issuer creates one asset record bound to your identity; details are AES-256-GCM encrypted and only the hash goes on chain. <b>Four</b>, you accept with your own signature, so nothing ever lands on you unasked, spam credentials are impossible. <b>Five</b>, anyone verifies straight from the chain, and every change is a public event.\n\nThe table at the bottom is our differentiator, read it row by row. Today passwords in a database, ours signatures from keys you hold. Today NFT metadata public, ours contents encrypted while validity stays public. Today silent assignment and revocation, ours holder consent plus on-chain revocation. Today ask the issuer and trust the reply, ours three checks with no permission needed.",cue:"CUE: Point at each of the 5 steps, then read the 4 table rows. Do not paraphrase the table.",trans:"TRANSITION: Now the exact six-step technical workflow."},
{t:"Page 3 - Technical Workflow + Architecture",img:"slides/cred-3.png",time:"1:40 - 3:10",pts:["6-step workflow with keccak + AES-GCM","Browser + CredentialVault.sol + IPFS + MetaMask","On-chain vs IPFS vs device vs nowhere","Solidity 0.8.30, OZ v5, Foundry, ethers v6"],script:"Workflow, six steps, allwords matter.\n\n<b>One</b>, issuer hashes the file with keccak256 in the browser. The file is never uploaded. <b>Two</b>, issuer encrypts details with AES-256-GCM, key derived from the issuer signature via HKDF. <b>Three</b>, pin the ciphertext to IPFS through one edge function and write the record; the contract checks the Issuer role first or the transaction reverts. <b>Four</b>, holder accepts, Pending becomes Active by holder signature. <b>Five</b>, holder shares a QR carrying holder plus hash plus key and nothing else; the key rides in the URL hash fragment so it never touches server logs. <b>Six</b>, verifier runs three checks: chain record status, file re-hash equality, IPFS decryption readability.\n\nArchitecture in the middle. Browser app in React plus ethers does hashing, encrypting and reading with no backend. Smart contract CredentialVault.sol on Ethereum holds roles, records and events. IPFS holds ciphertext only. MetaMask signs every action.\n\nWhere things live, bottom left, memorize this. On chain: identity, role, hash, status, every event. IPFS: ciphertext only. Your device: the key with passphrase backup. Nowhere: plaintext or passwords.\n\nStack: Solidity 0.8.30, OpenZeppelin v5 AccessControl, Foundry tests, React 18 TypeScript Vite ethers v6, Web Crypto AES-GCM plus HKDF, IPFS via Pinata, Sepolia plus MetaMask plus Vercel plus CI. The prototype capture on screen reads verdict, issuer and dates live from the contract with no wallet and no account.",cue:"CUE: Slow on steps 1, 5 and 6. Those are the privacy guarantees judges test.",trans:"TRANSITION: Claims are cheap, so here is proof it is built."},
{t:"Page 4 - Feasibility + Challenges",img:"slides/cred-4.png",time:"3:10 - 4:10",pts:["LIVE Sepolia + Sourcify, 56 + 18 tests, batch 100, 0 DBs","PS requirements all Built + Next steps","Lost key, pin lapse, admin trust, no wallet, testnet"],script:"Already built, top row. <b>Live</b> on Sepolia, source verified exact match on Sourcify. <b>56</b> contract tests covering unit, fuzz and invariant at 100 percent line and branch. <b>18</b> browser crypto tests for tamper, wrong key and plaintext leaks. <b>100</b> assets issued in one batch transaction. <b>Zero</b> application databases; the chain is the store, CI on every push.\n\nPS mapping, every requirement built. Decentralised identity built as key-pair identity checked on every action, next is did:pkh DID documents. Asset ownership built as unique records bound to one identity, next ERC-721 and 5192 soulbound views. Role-based access built with Admin and Issuer via OpenZeppelin, next Manager and Auditor. Audit trail built with 8 event types from issue and accept to revoke, reinstate, admin-revoke, register and deregister.\n\nChallenges, answered honestly. Lost wallet key: passphrase backup plus issuer re-derivation, social recovery next. IPFS pin lapses: chain proof survives, re-pin on your own node. Admin is trusted: every admin action is a public event, multisig in production. Users without wallets: verify needs no wallet, share by QR or paste. Testnet only: identical bytecode deploys to an L2 or permissioned Besu chain. Verify yourself at the contract and repo on screen.",cue:"CUE: Read the contract address prefix aloud. Point at Sourcify exact match.",trans:"TRANSITION: Who gains and by how much?"},
{t:"Page 5 - Impact",img:"slides/cred-5.png",time:"4:10 - 4:40",pts:["BEL, institutions, holders, verifiers","Today email-wait vs seconds","22 percent breaches, 22 crore cost","Security, audit, privacy, speed, sovereignty"],script:"Who benefits. Organisations like BEL put staff identities, roles and asset custody, licences, clearances, equipment, on one ledger with no central credential store to breach. Issuing institutions issue once, up to 100 per batch, revoke or reinstate in one transaction, and stop answering verification emails. Holders decide who reads each asset. Verifiers get an answer in seconds even if the issuer no longer exists.\n\nThe Today versus With CredVault contrast: today email the issuer and wait, trust whoever replies, edits leave no trace, the record dies with the issuer. With us, seconds, cryptographic, auditable, permanent.\n\nNumbers judges respect: 22 percent of breaches begin with stolen credentials, Verizon 2025. Average India breach cost 22 crore rupees, IBM 2025. Benefits in five words: security with no password store, audit as public events, privacy end to end, speed in seconds, sovereignty as open source on your own chain.",cue:"CUE: Cite the two numbers slowly and point at them.",trans:"TRANSITION: References and the killer close."},
{t:"Page 6 - References + Close",img:"slides/cred-6.png",time:"4:40 - 5:00",pts:["SIH, W3C DIDs, EIPs, OZ, Verizon, IBM, RFCs","Ciphertext-only IPFS proof","3 ways in + live links"],script:"References are all primary sources: SIH 26125, W3C DIDs 1.0, did:pkh, EIP 721 and 5192 soulbound NFTs, OpenZeppelin v5, Verizon and IBM 2025 reports, HKDF, ECDSA and AES-GCM standards.\n\nPrototype proof at the bottom: what IPFS serves is ciphertext; without the key even our own page shows nothing. Three ways in: paste a code, scan a QR, or type address plus hash. Live demo, source and the Sepolia contract are all on screen.\n\nJudges, <b>no registrar, no server, no fake record.</b> Thank you, I will verify a live QR with no wallet right now if you like.",cue:"CUE: End with the bold line verbatim. Immediately offer the live QR scan.",trans:"Q&A READY: gas = batch 100 now, L2 paise later. GDPR = only hashes on chain, shred key to forget. Lost key = re-derive after KYC."}
],qa:"<h3>CredVault - Likely Q and A (30-sec answers)</h3><b>Q: Gas for millions of credentials?</b><br>A: Batch 100 per transaction today. Production deploys identical bytecode to Polygon, Arbitrum or Base where per-cert cost is fractions of a cent, plus paymaster-sponsored gas.<br><br><b>Q: GDPR right to be forgotten on immutable chain?</b><br>A: Chain holds only opaque keccak hashes and IPFS pointers, zero PII. Delete the key and unpin the ciphertext and the data is cryptographically shredded forever.<br><br><b>Q: Student loses wallet?</b><br>A: Encryption key derives deterministically from issuer signature over address plus hash. Registrar re-derives after KYC without touching the on-chain record."}

let cur='artify';
function show(k,btn){cur=k;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');render();}
function render(){
const p=data[cur];
const sb=document.getElementById('sidebar');
const mn=document.getElementById('main');
sb.innerHTML='<div style="font-size:12px;color:#94a3b8;margin-bottom:8px">'+p.title+'<br><span style=color:#64748b>'+p.file+'</span></div>'+p.slides.map((s,i)=>'<div class="slide-card'+(i==0?' active':'')+'" id="card'+i+'" onclick="jump('+i+')"><h3>'+(i+1)+'. '+s.t+' <span style=color:#64748b>'+s.time+'</span></h3>'+(s.img?'<img src="'+s.img+'" loading="lazy" onclick="openLB(\''+s.img+'\')" />':'<div style="background:#0f172a;border:1px dashed #475569;border-radius:8px;padding:10px;font-size:12px;color:#facc15">ORCA slide image pending. Export Techie-SIH26176.pptx to PDF to enable images.</div>')+'<ul>'+s.pts.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>').join('');
mn.innerHTML='<h2 style="margin-bottom:12px">'+p.title+'</h2>'+p.slides.map((s,i)=>'<div class="script-block" id="blk'+i+'"><h2>'+(i+1)+'. '+s.t+'</h2><span class="time">'+s.time+'</span>'+(s.img?'<img src="'+s.img+'" style="width:100%;border-radius:10px;margin:10px 0;border:1px solid #334155" />':'')+'<div class="say">'+s.script+'</div><div class="cue">'+s.cue+'</div><div class="trans">'+s.trans+'</div><div style="margin-top:8px"><button class="tab" onclick="jump('+(i-1)+')">Prev</button> <button class="tab" onclick="jump('+(i+1)+')">Next</button></div></div>').join('')+'<div class="qa">'+p.qa+'</div>';
}
function openLB(src){document.getElementById('lbimg').src=src;document.getElementById('lb').classList.add('open')}
function closeLB(){document.getElementById('lb').classList.remove('open')}
function jump(i){const p=data[cur];if(i<0)i=0;if(i>=p.slides.length)i=p.slides.length-1;document.querySelectorAll('.slide-card').forEach(c=>c.classList.remove('active'));const c=document.getElementById('card'+i);if(c){c.classList.add('active');c.scrollIntoView({behavior:'smooth',block:'nearest'})}const b=document.getElementById('blk'+i);if(b){b.scrollIntoView({behavior:'smooth',block:'start'});b.classList.add('highlight');setTimeout(()=>b.classList.remove('highlight'),1200)}}
let tInt=null;
function startTimer(){let s=300;clearInterval(tInt);tInt=setInterval(()=>{s--;if(s<0){clearInterval(tInt);document.getElementById('timer').textContent="TIME UP";return}let m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.getElementById('timer').textContent=m+":"+ss;},1000);}
render();
</script>
